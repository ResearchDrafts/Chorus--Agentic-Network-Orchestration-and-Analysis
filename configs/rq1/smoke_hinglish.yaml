# RQ1 bank-regime smoke test: the Hinglish arm of configs/rq1/smoke.yaml.
#
# Identical to smoke.yaml except for language_condition, the probe question
# and the two anchor labels -- all three of which MUST be written in this
# arm's language. The seed is deliberately unchanged: that is what makes this
# a matched set. Same seed means the same graph, the same neighbour draws and
# the same bank item for the same sender on the same side, so the two runs
# differ in the rendering of the text and in nothing else.
#
#   python run_simulation.py configs/rq1/smoke_hinglish.yaml

K: 3
M: 8
N: 3
alpha: 0.5
api_base: http://localhost:8000/v1
bank_path: data/bank/test_bank.csv
checkpoint_every_n_turns: 1
delivery: "on"
graph_degree: 4
graph_rewire_p: 0.1
language_condition: hinglish
meme_injection:
  enabled: false
memory_rounds: null
max_prompt_tokens: null
model_backend_id: hosted_vllm/Qwen/Qwen2.5-7B-Instruct
neighbor_strategy: graph
persona_pool_id: pool_20
probe_mass_floor: 0.5
probe_question: Kya city bus fares subsidised rehne chahiye?
probe_top_logprobs: 20
rate_limits: {}
regime: bank
rq_target: RQ1_RQ2
run_id: rq1_smoke_hinglish
seed: 42
stance_high_label: fares subsidised rehne chahiye
stance_low_label: fares subsidised nahi hone chahiye
stance_scale:
- 1
- 2
- 3
- 4
- 5
- 6
- 7
temperature: 0.7
topic: whether city bus fares should stay subsidised
trial_number: 1
