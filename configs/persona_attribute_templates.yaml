demographic:
  english: >-
    You are {age} years old, identify as {gender}, and your highest level
    of education is {education}.
  hinglish: >-
    Aapki age {age} saal hai, aap {gender} identify karte hain, aur aapki
    sabse zyada education {education} hai.
  romanized_hindi: >-
    Aapki umr {age} saal hai, aap {gender} hain, aur aapki sabse uchi
    shiksha {education} hai.
  hindi: >-
    आपकी उम्र {age} वर्ष है, आप {gender} हैं, और आपकी सबसे ऊँची शिक्षा
    {education} है।

big5:
  english: >-
    On personality, you tend to be {openness} in openness to new ideas,
    {conscientiousness} in conscientiousness, {extraversion} in
    extraversion, {agreeableness} in agreeableness, and {neuroticism} in
    neuroticism.
  hinglish: >-
    Personality ki baat karein to, aap naye ideas ke liye {openness}
    openness rakhte hain, {conscientiousness} conscientiousness,
    {extraversion} extraversion, {agreeableness} agreeableness, aur
    {neuroticism} neuroticism.
  romanized_hindi: >-
    Swabhav ki baat karen to, aapme naye vicharon ke liye {openness}
    khulapan hai, {conscientiousness} kartavya-nishtha,
    {extraversion} bahirmukhta, {agreeableness} sahmati, aur
    {neuroticism} sangyanatmak asthirata hai.
  hindi: >-
    स्वभाव की बात करें तो, आपमें नए विचारों के लिए {openness} खुलापन है,
    {conscientiousness} कर्तव्य-निष्ठा, {extraversion} बहिर्मुखता,
    {agreeableness} सहमति, और {neuroticism} संज्ञानात्मक अस्थिरता है।

level_words:
  english: {high: "high", low: "low"}
  hinglish: {high: "high", low: "low"}
  romanized_hindi: {high: "uchi", low: "kam"}
  hindi: {high: "उच्च", low: "निम्न"}
